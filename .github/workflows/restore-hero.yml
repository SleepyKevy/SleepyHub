name: Restore hero image

on:
  push:
    paths:
      - '.hero-direct-ready'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy verified raccoon artwork from SleepySource
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/SleepyKevy/SleepySource/main/assets/default.png' \
            --output assets/images/sleepy-raccoon.png

          python - <<'PY'
          from pathlib import Path
          p = Path('assets/images/sleepy-raccoon.png')
          data = p.read_bytes()
          if not data.startswith(b'\x89PNG\r\n\x1a\n'):
              raise SystemExit('Downloaded hero file is not a valid PNG')
          if len(data) < 50000:
              raise SystemExit(f'Hero PNG is unexpectedly small: {len(data)} bytes')
          print(f'Validated hero PNG: {len(data)} bytes')
          PY

          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('assets/images/sleepy-raccoon.webp', 'assets/images/sleepy-raccoon.png')
          p.write_text(s, encoding='utf-8')
          PY

          rm -rf .hero-parts
          rm -f .hero-direct-ready
          rm -f .github/workflows/restore-hero.yml

      - name: Commit restored hero
        shell: bash
        run: |
          git config user.name 'SleepyHub Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Restore high-quality hero raccoon'
          git push origin HEAD:main
